name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check generated release files
        run: node scripts/generate-release-files.mjs --check

      - name: Validate public tree
        run: node scripts/validate.mjs

      - name: Check shell syntax
        run: |
          bash -n scripts/compare-upstream.sh
          bash -n scripts/smoke-install.sh

      - name: Install Copilot CLI for packaging smoke test
        run: npm install --global @github/copilot@1.0.81-12

      - name: Smoke test marketplace installation
        run: scripts/smoke-install.sh

      - name: Install poteto-mode tool dependencies
        working-directory: pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile

      - name: Run poteto-mode tool tests
        working-directory: pstack/skills/poteto-mode/scripts
        run: bun test orch watch-pr

      - name: Typecheck poteto-mode tools
        working-directory: pstack/skills/poteto-mode/scripts
        run: bun run typecheck

      - name: Check tool help
        working-directory: pstack/skills/poteto-mode/scripts
        run: |
          node check-plan.mjs --help
          ./watch-pr/watch-pr --help
          ./orch/orch.ts --help

      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./pstack/plugin.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
